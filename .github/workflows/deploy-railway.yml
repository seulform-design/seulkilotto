name: Deploy to Railway

on:
  push:
    branches:
      - main
      - "cursor/**"
  workflow_dispatch:

concurrency:
  group: railway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Railway deploy
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    permissions:
      contents: read
    env:
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
      RAILWAY_PUBLIC_URL: ${{ vars.RAILWAY_PUBLIC_URL }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Railway configuration
        id: cfg
        run: |
          if [ -n "$RAILWAY_TOKEN" ] && [ -n "$RAILWAY_PROJECT_ID" ] && [ -n "$RAILWAY_ENVIRONMENT_ID" ] && [ -n "$RAILWAY_SERVICE_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy latest pushed commit
        if: ${{ steps.cfg.outputs.configured == 'true' }}
        run: |
          railway up --ci \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_SERVICE_ID"

      - name: Publish deployment summary
        if: ${{ steps.cfg.outputs.configured == 'true' && env.RAILWAY_PUBLIC_URL != '' }}
        run: |
          {
            echo "### Railway deployment"
            echo ""
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- URL: ${RAILWAY_PUBLIC_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Explain missing Railway settings
        if: ${{ steps.cfg.outputs.configured != 'true' }}
        run: |
          echo "Railway auto-deploy skipped."
          echo "Set GitHub secret RAILWAY_TOKEN and repository variables RAILWAY_PROJECT_ID, RAILWAY_ENVIRONMENT_ID, RAILWAY_SERVICE_ID."

      - name: Smoke test production API
        if: ${{ steps.cfg.outputs.configured == 'true' && env.RAILWAY_PUBLIC_URL != '' }}
        run: |
          python3 - <<'PY'
          import json, sys, time, urllib.request
          base = "${RAILWAY_PUBLIC_URL}".rstrip("/")
          expected_build = "expand24-v3"

          def get(url, timeout=90):
              with urllib.request.urlopen(url, timeout=timeout) as r:
                  return json.loads(r.read().decode("utf-8", "ignore"))

          meta_url = f"{base}/api/v1/meta"
          # Railway 빌드가 Actions 종료 후에도 이어질 수 있어 재시도.
          meta = None
          last_err = None
          for i in range(24):
              try:
                  meta = get(meta_url, timeout=30)
                  build = meta.get("coverage_build")
                  if build == expected_build:
                      break
                  last_err = f"coverage_build={build!r} (want {expected_build})"
              except Exception as exc:
                  last_err = str(exc)
              time.sleep(15)
          else:
              print(f"Smoke test failed for {meta_url}: {last_err}", file=sys.stderr)
              raise SystemExit(1)

          if not isinstance(meta, dict) or "latest_round" not in meta:
              raise RuntimeError(f"unexpected meta: {meta}")
          print(f"Smoke meta OK: coverage_build={meta.get('coverage_build')} latest_round={meta.get('latest_round')}")

          rv_url = f"{base}/api/v1/photo-analysis/review-verification"
          rv = get(rv_url, timeout=120)
          cov = rv.get("review_coverage_set") or {}
          expand = cov.get("expand18") or []
          size = cov.get("expand_size") or len(expand)
          if size < 24 or len(expand) < 24:
              raise RuntimeError(
                  f"expand too small after deploy: size={size} len={len(expand)} build={rv.get('coverage_build')}"
              )
          if rv.get("coverage_build") != expected_build:
              raise RuntimeError(f"review-verification build mismatch: {rv.get('coverage_build')}")
          print(
              f"Smoke review OK: expand_len={len(expand)} expand_size={size} "
              f"mode={cov.get('expand18_mode')} build={rv.get('coverage_build')}"
          )
          PY
